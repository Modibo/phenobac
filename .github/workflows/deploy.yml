name: Déploiement PhénoBac

# Déclenché à chaque push sur main (ou manuellement).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Vérification syntaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check sur le serveur et les fonctions
        run: |
          node --check server.js
          for f in netlify/functions/*.js netlify/functions/lib/*.js; do
            echo "check $f"; node --check "$f";
          done

      - name: Concordance des tables de concentrations critiques
        run: python3 outils/verifier-tables.py

      # Deux référentiels qui rendraient le même résultat seraient un mensonge
      # d'interface : ce banc vérifie que chaque différence déclarée produit
      # bien un rendu différent, dans un sens comme dans l'autre.
      - name: Le choix du référentiel change bien le rendu
        run: node outils/essai-referentiel.js

      # Un limiteur trop serré casserait l'interprétation sans qu'on le voie :
      # l'utilisateur croirait à une panne réseau.
      - name: La limitation de débit laisse passer l'usage normal
        run: node outils/essai-debit.js

  deploy:
    name: Déploiement VPS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Synchroniser le code et redéployer
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          # 1) envoyer le code (on préserve .env et les données du serveur)
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude '.env' \
            --exclude 'data' --exclude 'node_modules' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:/opt/phenobac/"

          # 2) reconstruire et relancer le conteneur sur le VPS
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            set -e
            cd /opt/phenobac
            mkdir -p public
            cp -f phenobac.html success.html public/
            cp -f manifest.webmanifest service-worker.js public/ 2>/dev/null || true
            cp -f icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png public/ 2>/dev/null || true
            docker compose up -d --build
            docker image prune -f'
