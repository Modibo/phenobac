name: Déploiement PhénoBac

# Déclenché à chaque push sur main (ou manuellement).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Vérification syntaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check sur le serveur et les fonctions
        run: |
          node --check server.js
          node --check base-connaissances.js
          node --check moteur.js
          for f in netlify/functions/*.js netlify/functions/lib/*.js; do
            echo "check $f"; node --check "$f";
          done

      # La base fait foi ; ce contrôle vérifie que le moteur en bâtit
      # exactement les tables, et que la page ne les redéclare pas.
      - name: La base, le moteur et la page concordent
        run: python3 outils/verifier-tables.py

      # Ce qu'une livraison change aux règles, imprimé dans le journal de la
      # CI — et un échec si BASE_VERSION n'a pas suivi : deux bases
      # différentes portant le même numéro rendraient tout rendu ancien
      # irrattachable à ses règles.
      - name: Journal des règles modifiées
        run: |
          git fetch --depth=2 origin ${{ github.sha }} 2>/dev/null || true
          python3 outils/journal-base.py HEAD~1 || exit 1

      # Une résistance naturelle déclarée à tort fait lever une FAUSSE alerte
      # de cohérence — le pire défaut possible pour cette fonction.
      - name: Les résistances naturelles correspondent au document EUCAST
        run: python3 outils/verifier-naturelles.py

      # Deux référentiels qui rendraient le même résultat seraient un mensonge
      # d'interface : ce banc vérifie que chaque différence déclarée produit
      # bien un rendu différent, dans un sens comme dans l'autre.
      - name: Le choix du référentiel change bien le rendu
        run: node outils/essai-referentiel.js

      # Un limiteur trop serré casserait l'interprétation sans qu'on le voie :
      # l'utilisateur croirait à une panne réseau.
      - name: La limitation de débit laisse passer l'usage normal
        run: node outils/essai-debit.js

      # Un cas d'entraînement dont la réponse contredit le moteur enseignerait
      # le contraire de ce que l'application rend.
      - name: La banque d'entraînement dit la même chose que le moteur
        run: node outils/essai-banque.js

      # Une alerte qui se déclenche à tort apprend à ignorer les alertes :
      # chaque contrôle est éprouvé dans les deux sens.
      - name: Les alertes de cohérence se déclenchent quand il faut, et seulement alors
        run: node outils/essai-coherence.js

      # Le sens des seuils de diamètre est INVERSÉ par rapport aux CMI. Une
      # inversion ne lèverait aucune exception : elle rendrait résistante
      # toute souche sensible, et ne se verrait qu'au lit du malade.
      - name: Les diamètres se lisent dans le bon sens
        run: node outils/essai-diametres.js

      # Un contrôle de qualité mené avec un disque d'une autre charge ne
      # prouve rien. Ce contrôle confronte les charges annoncées à celles du
      # classeur EUCAST — deux documents indépendants.
      - name: Le contrôle de qualité s'accorde avec les tables de seuils
        run: python3 outils/verifier-cq.py

      # GLASS refuse un fichier portant un code hors liste : un export invalide
      # ne serait pas « approximatif », il serait rejeté.
      - name: L'export de surveillance est conforme au manuel GLASS
        run: node outils/essai-glass.js

      # Les conditions de réalisation déclarées sont confrontées à ce que le
      # référentiel exige. Deux façons d'échouer, la seconde étant la pire :
      # taire une non-conformité, ou alerter sur un champ non renseigné — ce
      # qui apprend à fermer le panneau.
      - name: Les conditions de réalisation sont confrontées au référentiel
        run: node outils/essai-conditions.js

      # Le raccord page ↔ porte HTTP ↔ moteur n'était couvert par rien. C'est
      # pourtant là qu'une régression a un jour cassé TOUTES les
      # interprétations sans qu'aucun banc ne bronche : le raisonnement était
      # intact, c'est la jonction qui ne tenait plus.
      - name: La page, la porte et le moteur se parlent encore
        run: python3 outils/verifier-raccord.py

      # PhénoBac est écrite pour des laboratoires où la connexion est
      # intermittente. Tout repose sur une liste de huit chemins, et
      # cache.addAll() est ATOMIQUE : un seul 404 et rien n'est mis en cache,
      # sans erreur visible. L'application marcherait jusqu'à la première
      # coupure — c'est-à-dire jusqu'au jour où l'on en a besoin.
      - name: L'application tient encore sans réseau
        run: python3 outils/verifier-horsligne.py

      # « GRATUIT · SANS COMPTE · SANS LICENCE » n'est pas un argument de
      # vente : c'est un engagement envers des laboratoires sans budget
      # logiciel. L'infrastructure de licence existe toujours, dormante, pour
      # d'éventuelles licences d'établissement — et une infrastructure
      # dormante se réveille par accident.
      - name: L'application tient la promesse qu'elle affiche
        run: python3 outils/verifier-gratuite.py

      # § 15 : le commentaire distingue observation, interprétation,
      # hypothèse, limites et test complémentaire. Et surtout, § 3 : une
      # hypothèse que rien n'a tranchée ne se dit jamais « confirmée » —
      # c'est la seule de ces règles qui puisse coûter un traitement.
      - name: Le commentaire distingue ses cinq moments
        run: node outils/essai-commentaire.js

  deploy:
    name: Déploiement VPS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Synchroniser le code et redéployer
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          # 1) envoyer le code (on préserve .env et les données du serveur)
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude '.env' \
            --exclude 'data' --exclude 'node_modules' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:/opt/phenobac/"

          # 2) reconstruire et relancer le conteneur sur le VPS
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            set -e
            cd /opt/phenobac
            mkdir -p public
            cp -f phenobac.html success.html public/
            cp -f manifest.webmanifest service-worker.js public/ 2>/dev/null || true
            cp -f icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png public/ 2>/dev/null || true
            docker compose up -d --build
            docker image prune -f'
